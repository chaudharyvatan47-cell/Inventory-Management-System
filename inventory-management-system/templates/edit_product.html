{% extends "base.html" %}
{% block title %}Edit Product - Inventory Manager{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <div>
            <h1>Edit Product</h1>
            <p>Update product information.</p>
        </div>
    </div>

    <form class="form-card" method="POST">
        <label for="name">Product Name</label>
        <input id="name" name="name" type="text" value="{{ product.name }}" required>

        <label for="category">Category</label>
        <input id="category" name="category" type="text" value="{{ product.category }}" required>

        <label for="price">Price (₹)</label>
        <input id="price" name="price" type="number" step="0.01" min="0" value="{{ product.price }}" required>

        <label for="quantity">Quantity</label>
        <input id="quantity" name="quantity" type="number" min="0" value="{{ product.quantity }}" required>

        <div class="form-actions">
            <button class="button" type="submit">Save Changes</button>
            <a class="button secondary" href="{{ url_for('products_page') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
